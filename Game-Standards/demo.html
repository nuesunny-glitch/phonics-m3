<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Game Feedback Standard — Demo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="feedback-standard.css">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Kanit', sans-serif;
    background: #f4f2fb;
    margin: 0;
    padding: 20px 16px 60px;
    color: #2b2b3a;
  }
  .container { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 1.3rem; margin-bottom: 4px; }
  p.lead { color: #6a6a7a; margin-top: 0; font-size: 0.9rem; }
  .card {
    background: #fff;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 4px 0 #e2ddf5;
  }
  .card h2 { font-size: 1.05rem; margin-top: 0; }
  .choice-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin: 14px 0;
  }
  .choice-btn {
    padding: 14px 8px;
    border-radius: 12px;
    border: 2px solid #ddd6f5;
    background: #faf9ff;
    font-family: inherit;
    font-size: 1rem;
    cursor: pointer;
  }
  .choice-btn:active { transform: scale(0.97); }
  #feedback { min-height: 34px; margin-top: 6px; }
  label { display: block; font-size: 0.9rem; margin-bottom: 6px; }
  input[type="number"] {
    width: 80px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-family: inherit;
    font-size: 1rem;
  }
  .sim-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
  .sim-btn {
    padding: 10px 16px;
    border-radius: 999px;
    border: none;
    background: #2b2b3a;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
  }
  #result { min-height: 20px; }
  .log { font-size: 0.85rem; color: #6a6a7a; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">

  <h1>🔊 Game Feedback Standard — Demo</h1>
  <p class="lead">Reference / test harness for <code>feedback-standard.js</code>. Not a lesson — for future game builders to see the standard working.</p>

  <div class="card">
    <h2>1. Answer feedback (random phrase + speaker)</h2>
    <p>The cat is ____ the box.</p>
    <div class="choice-grid">
      <button type="button" class="choice-btn" data-correct="true">in</button>
      <button type="button" class="choice-btn" data-correct="false">under</button>
      <button type="button" class="choice-btn" data-correct="false">at</button>
      <button type="button" class="choice-btn" data-correct="false">on</button>
    </div>
    <div id="feedback"></div>
  </div>

  <div class="card">
    <h2>2. Final score tiers</h2>
    <div class="sim-row">
      <label for="scoreInput">Score out of 10:
        <input type="number" id="scoreInput" min="0" max="10" value="9">
      </label>
      <button type="button" class="sim-btn" id="simulateBtn">Simulate result</button>
    </div>
    <div id="result"></div>
    <div id="hookLog" class="log"></div>
  </div>

</div>

<script src="feedback-standard.js"></script>
<script>
  var feedbackEl = document.getElementById('feedback');
  document.querySelectorAll('.choice-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var isCorrect = btn.getAttribute('data-correct') === 'true';
      FeedbackStandard.renderFeedback(feedbackEl, isCorrect);
    });
  });

  var resultEl = document.getElementById('result');
  var hookLog = document.getElementById('hookLog');
  document.getElementById('simulateBtn').addEventListener('click', function () {
    var score = Math.max(0, Math.min(10, parseInt(document.getElementById('scoreInput').value, 10) || 0));
    hookLog.textContent = '';
    var tier = FeedbackStandard.renderScoreResult(resultEl, score, 10, {
      onWin: function () { hookLog.textContent = 'onWin() fired — award XP / unlock next lesson here.'; },
      onRetry: function () { hookLog.textContent = 'onRetry() fired — restart the quiz here.'; },
      onReview: function () { hookLog.textContent = 'onReview() fired — show a review screen here.'; }
    });
    console.log('tier:', tier);
  });
</script>
</body>
</html>
